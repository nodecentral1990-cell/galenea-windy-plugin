<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Passage plan plugin: test page (not Windy)</title>
<link rel="stylesheet" href="leaflet.css">
<style>
 html,body{margin:0;height:100%;font-family:sans-serif;background:#1d2b3a}
 #map{position:absolute;left:0;top:24px;right:540px;bottom:0;background:#1d2b3a}
 #pane{position:absolute;right:0;top:24px;width:540px;bottom:0;overflow:hidden;background:rgba(40,40,40,.97);color:#eee;padding:0;box-sizing:border-box}
 #pane .plugin__content{position:absolute;inset:0;overflow-y:auto;padding:8px;box-sizing:border-box} /* like Windy (assumed): the plugin's section is the scrolling box */
 #bar{position:absolute;left:0;right:0;top:0;height:24px;background:#900;color:#fff;font:12px/24px sans-serif;padding-left:8px}
 #pane .plugin__title{font-size:15px;font-weight:bold;margin-bottom:4px}
 #pane .plugin__mobile-header{display:none}
 /* phones: Windy's "fullscreen" plugin layout (the plugin covers the whole screen) */
 @media (max-width:600px){ #map{right:0} #pane{left:0;right:0;width:auto;z-index:1000} #pane .plugin__mobile-header{display:block;padding:8px;font-weight:bold;background:#222} #pane .plugin__content{top:34px} }
</style></head>
<body><div id="bar">TEST PAGE: stand-in for Windy with FAKE weather. Not Windy, not real data.</div>
<div id="map"></div><div id="pane"></div>
<script src="leaflet.js"></script>
<script src="harness.js"></script>
</body></html>
